<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotoentintados - Galaxia Edition</title>
    
    <link rel="icon" type="image/png" href="img/iconweb.png">
    <link rel="apple-touch-icon" href="img/iconweb.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#fdfdfd">
    
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; background: #fdfdfd; margin: 0; padding: 10px; color: #333;
            padding-bottom: 50px; position: relative; min-height: 100vh; box-sizing: border-box;
            transition: background 1.5s ease-in-out, color 0.5s ease;
        }

        body.starwars-background {
            background: #000 url('img/background-starwars.png') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; }

        .visor { 
            position: relative; width: 95%; max-width: 680px; aspect-ratio: 2 / 1; 
            margin: 10px auto; background: #fff; border: 2px solid #ddd; 
            border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; justify-content: center; align-items: center;
        }

        #mica { 
            position: absolute; top: 15%; left: 12%; width: 76%; height: 70%; 
            z-index: 1; border-radius: 40px; transition: background 0.3s ease;
            mix-blend-mode: multiply; opacity: 1; box-shadow: inset 0 8px 15px rgba(0,0,0,0.1);
        }

        #armazon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; pointer-events: none; }

        #reflejo {
            position: absolute; top: 15%; left: 12%; width: 76%; height: 70%; 
            z-index: 3; border-radius: 40px; pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
            opacity: 0; transition: opacity 0.5s ease;
        }

        .seccion { background: white; max-width: 680px; margin: 15px auto; padding: 15px; border-radius: 12px; border: 1px solid #eee; transition: all 0.5s ease; }
        
        body.starwars-background .seccion {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        select { width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; background: #fff; color: #333; }
        
        body.starwars-background select {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #ffd700; /* Un toque dorado estilo SW */
        }

        .boton-mica { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #eee; cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        .boton-mica.seleccionado { transform: scale(1.15); border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.3); }
        
        body.starwars-background .boton-mica.seleccionado { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }

        .mica-boton-container { display: flex; flex-direction: column; align-items: center; margin: 10px; width: 65px; }
        .mica-label { font-size: 0.8em; margin-top: 8px; font-weight: 600; }
        
        body.starwars-background .mica-label { color: #fff; }

        .mica-sw-break { flex-basis: 100%; height: 0; margin: 0; }

        #btnOscurecer { width: 95%; max-width: 400px; padding: 18px; font-size: 1.1em; font-weight: bold; border-radius: 10px; cursor: pointer; border: none; background: #333; color: white; margin: 20px 0; transition: background 0.3s; }
        #btnOscurecer:active { background: #000; transform: translateY(2px); }
        #btnOscurecer:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }

        body.starwars-background #btnOscurecer { background: #ffd700; color: #000; }

        .version-tag { position: absolute; bottom: 15px; right: 15px; font-size: 0.75rem; color: #888; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
    </style>
</head>
<body>

    <audio id="audioSW" src="audio/starwars-theme.mp3" loop></audio>

    <h1>Fotoentintados</h1>

    <div class="visor">
        <div id="mica"></div>
        <img id="armazon" src="" alt="Armazón">
        <div id="reflejo"></div>
    </div>

    <div class="seccion">
        <h3>Selecciona Armazón</h3>
        <select id="modelo" onchange="actualizarColores()"></select>
        <select id="colorArmazon" onchange="cambiarArmazon()"></select>
    </div>

    <div class="seccion">
        <h3>Elige la Mica</h3>
        <div id="botonesMica" style="display:flex; justify-content:center; flex-wrap:wrap;"></div>
        <button id="btnOscurecer" onclick="oscurecerActual()">Oscurecer</button>
    </div>

    <div class="version-tag">v6.4 - Alei - SW Edition</div>

    <script>
        const modelos = {
            abbas: ["chinatown","fargo","persepolis"],
            agnes: ["chocochip","fargo"],
            akira: ["guadalajara","habana","sansebastian","venecia"],
            alfonso: ["tofu"],
            aldous: ["nogal","grafito","niquel"],
            angela: ["alpes","pirineo"],
            artigas: ["laton","mercurio","plomo"],
            barb: ["bronce"],
            bernard: ["alpes","apalache","sierra"],
            bill: ["ballena","grafito"],
            "bill ventana": ["alcachofa","grafito"],
            billie: ["medianoche","limalimon","espresso","pitaya","pasita"],
            clark: ["grafito"],
            connie: ["volcan"],
            dafna: ["cedro","olivo","nube","espresso","clavel"],
            "dafna titan": ["manhattan","collins"],
            daria: ["onix", "cereza"],
            desmond: ["caliza","altamar"],
            dwight: ["tinieblas","octagon","rayo"],
            esquivel: ["grafito","niquel","chocochip","clavel"],
            "esquivel titan": ["martini","cosmopolitan"],
            fran: ["uva","cedro","olivo"],
            garcia: ["neptuno","grafito","aceituna","estela"],
            garwin: ["laton", "acero"],
            glorp: ["sideral"],
            "glorp antimateria": ["estelar","orbita"],
            godard: ["habana","hollywood","matinee","paradiso"],
            guillermo: ["supernova","medianoche","merengue"],
            jaime: ["onix","piedra"],
            jocelyn: ["laton", "mercurio"],
            joyce: ["metamorfosis", "aurora"],
            laszlo: ["laton", "acero","bronce"],
            leon: ["grafito","amate","burbuja","aceituna"],
            leone: ["berlin","cannes","rotterdam"],
            lina: ["sunset", "manhattan"],
            linda: ["plomo", "laton"],
            marcela: ["merengue","caoba"],
            "marcela reform": ["napolitano", "cacao"],
            maria: ["bronce", "plomo"],
            martin: ["onix","espresso","maple","maple burbuja"],
            max: ["rayo","octagon"],
            meryl: ["merengue","nogal"],
            moleman: ["jupiter","sombra","onix","medusa"],
            molina: ["plomo", "laton"],
            nadiaiv: ["octagon"],
            pablo: ["dolores","cleri","olivia"],
            parks: ["laton","penique","bronce","plomo"],
            pedro: ["chocochip","las vegas","paris-texas"],
            starwars: ["Han Solo","Darth Vader","Chewie","Leia","Yoda","Skywalker","C-3PO","R2-D2","Obiwan"], 
            rivera: ["nogal","onix","aceituna","pasita","daiquiri","chocochip"],
            robin: ["laton","acero","plomo","bronce"],
            "robin caviar": ["osetra","beluga","esturion","caracol"],
            saramago: ["merengue","nogal"],
            sergioarmando: ["budapest","ayelen"],
            testa: ["tortuga","onix","amate"], tina: ["nogal","onix"],
            truman: ["onix"],
            vilma: ["rayo"],
            wong: ["hongkong","fargo"],
            yuri: ["guayaba","mojito","conga"],
            lucrecia: ["matcha","nogal","merengue"],
            yetta: ["brandy","americano","mordisco"],
            brooks: ["nogal"],
            penelope: ["nogal"],
            steven: ["nogal"],
            coen: ["nogal"],
            cortazar: ["melancolia","estela"],
            romero: ["nogal"],
            egon: ["tinieblas","mistico","octagon"]
        };

        const coloresMica = {
            celestun:  {inicio:"#fedee1", final:"#4f2e29"},
            mermejita: {inicio:"#d1ddb0", final:"#434343"},
            caleta:    {inicio:"#d6e3f5", final:"#4f2e29"},
            rosarito:  {inicio:"#f3f2c7", final:"#4f2e29"},
            miramar:   {inicio:"#dfd3e7", final:"#434343"},
            azufre:    {inicio:"#ecdbb0", final:"#783f03"},
            té:        {fijo:"#d0f3e2"},
            asteroid:  {desvanecido: {superior:"#E65C41", inferior:"#F9D29D"}},
            nebulosa:  {desvanecido: {superior:"#005B94", inferior:"#D6E3F5"}},
            estela:    {desvanecido: {superior:"#6B4F7B", inferior:"#dfd3e7"}} 
        };

        let micaSeleccionada = 'celestun';
        let animacionId = null;
        let botones = [];

        function inicializarMicas(modeloActual) {
            const container = document.getElementById("botonesMica");
            container.innerHTML = ""; 
            botones = [];

            const esStarWars = (modeloActual === 'starwars');
            const micasStandard = ['celestun', 'mermejita', 'caleta', 'rosarito', 'miramar', 'azufre', 'té'];
            const micasStarWars = ['asteroid', 'nebulosa', 'estela'];

            micasStandard.forEach(nombre => crearBotonMica(nombre, container));

            if (esStarWars) {
                const br = document.createElement("div");
                br.className = "mica-sw-break";
                container.appendChild(br);
                micasStarWars.forEach(nombre => crearBotonMica(nombre, container));
                seleccionarMica('asteroid', botones[7]); 
            } else {
                seleccionarMica('celestun', botones[0]);
            }
        }

        function crearBotonMica(nombre, container) {
            const mica = coloresMica[nombre];
            const cont = document.createElement("div"); cont.className = "mica-boton-container";
            const btn = document.createElement("div"); btn.className = "boton-mica";
            
            if (mica.desvanecido) {
                btn.style.background = `linear-gradient(180deg, ${mica.desvanecido.superior} 0%, ${mica.desvanecido.inferior} 100%)`;
            } else {
                btn.style.backgroundColor = mica.inicio || mica.fijo;
            }

            btn.onclick = () => seleccionarMica(nombre, btn);
            botones.push(btn);
            const label = document.createElement("span"); label.className = "mica-label";
            label.textContent = nombre.charAt(0).toUpperCase() + nombre.slice(1);
            cont.appendChild(btn); cont.appendChild(label); container.appendChild(cont);
        }

        function seleccionarMica(nombre, btn) {
            micaSeleccionada = nombre;
            if(animacionId) cancelAnimationFrame(animacionId);
            botones.forEach(b => b.classList.remove("seleccionado"));
            btn.classList.add("seleccionado");

            const mica = coloresMica[nombre];
            const micaElement = document.getElementById("mica");

            if (mica.desvanecido) {
                micaElement.style.background = `linear-gradient(180deg, ${mica.desvanecido.superior} 0%, ${mica.desvanecido.inferior} 100%)`;
                document.getElementById("btnOscurecer").disabled = true;
            } else {
                micaElement.style.background = mica.inicio || mica.fijo;
                document.getElementById("btnOscurecer").disabled = (nombre === "té");
            }
            document.getElementById("reflejo").style.opacity = 0;
            document.getElementById("mica").style.opacity = 1;
        }

        function oscurecerActual() {
            if(micaSeleccionada === "té" || coloresMica[micaSeleccionada].desvanecido) return;
            const inicio = hexToRgb(coloresMica[micaSeleccionada].inicio);
            const final = hexToRgb(coloresMica[micaSeleccionada].final);
            const duracion = 1500;
            let start = null;

            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = (timestamp - start) / duracion;
                if (progress > 1) progress = 1;

                let r = Math.round(inicio.r + (final.r - inicio.r) * progress);
                let g = Math.round(inicio.g + (final.g - inicio.g) * progress);
                let b = Math.round(inicio.b + (final.b - inicio.b) * progress);
                
                document.getElementById("mica").style.backgroundColor = `rgb(${r},${g},${b})`;
                document.getElementById("mica").style.opacity = 1 - (0.18 * progress);
                document.getElementById("reflejo").style.opacity = (0.65 * progress);

                if (progress < 1) animacionId = requestAnimationFrame(step);
            }
            if(animacionId) cancelAnimationFrame(animacionId);
            animacionId = requestAnimationFrame(step);
        }

        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
            return {r, g, b};
        }

        function inicializarModelos() {
            const select = document.getElementById("modelo");
            Object.keys(modelos).sort().forEach(m => {
                const opt = document.createElement("option"); opt.value = m;
                let label = m.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                if (label.toLowerCase().includes("nadiaiv")) label = "Nadia IV";
                opt.textContent = label; select.appendChild(opt);
            });
            actualizarColores();
        }

        function actualizarColores() {
            const m = document.getElementById("modelo").value;
            const s = document.getElementById("colorArmazon");
            const audio = document.getElementById("audioSW");
            
            s.innerHTML = "";
            (modelos[m] || []).sort().forEach(c => {
                const opt = document.createElement("option"); opt.value = c;
                opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
                s.appendChild(opt);
            });
            
            if (m === 'starwars') {
                document.body.classList.add('starwars-background');
                if (audio) audio.play().catch(() => console.log("Interacción requerida para audio"));
            } else {
                document.body.classList.remove('starwars-background');
                if (audio) { audio.pause(); audio.currentTime = 0; }
            }
            
            inicializarMicas(m);
            cambiarArmazon();
        }

        function cambiarArmazon() {
            const m = document.getElementById("modelo").value;
            const c = document.getElementById("colorArmazon").value;
            document.getElementById("armazon").src = "img/" + m + "-" + c + ".png";
        }

        inicializarModelos();
    </script>
</body>
</html>

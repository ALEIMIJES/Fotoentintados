<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotoentintados</title>
    
    <link rel="icon" type="image/png" href="img/iconweb.png">
    <link rel="apple-touch-icon" href="img/iconweb.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#fdfdfd">
    
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background: #fdfdfd; 
            margin: 0; 
            padding: 10px; 
            color: #333;
            padding-bottom: 50px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; }

        .visor { 
            position: relative; 
            width: 95%; 
            max-width: 680px; 
            aspect-ratio: 2 / 1; 
            margin: 10px auto; 
            background: #fff; 
            border: 2px solid #ddd; 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #mica { 
            position: absolute; 
            top: -5%; 
            left: 10%; 
            width: 80%; 
            height: 110%; 
            z-index: 1; 
            border-radius: 20px; 
            transition: background-color 0.3s ease;
        }

        #armazon { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            z-index: 2; 
            pointer-events: none; 
        }

        .seccion {
            background: white;
            max-width: 680px;
            margin: 15px auto;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            background: #fff;
        }

        .boton-mica { 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            border: 3px solid #eee; 
            cursor: pointer; 
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .boton-mica.seleccionado {
            transform: scale(1.15);
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0,123,255,0.3);
        }

        .mica-boton-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 10px; 
            width: 65px; 
        }

        .mica-label { 
            font-size: 0.8em; 
            margin-top: 8px; 
            font-weight: 600;
        }

        #btnOscurecer { 
            width: 95%;
            max-width: 400px;
            padding: 18px; 
            font-size: 1.1em; 
            font-weight: bold;
            border-radius: 10px; 
            cursor: pointer; 
            border: none;
            background: #333;
            color: white;
            margin: 20px 0;
        }
        
        #btnOscurecer:active { background: #000; transform: translateY(2px); }
        #btnOscurecer:disabled { background: #ccc; cursor: not-allowed; }

        .version-tag {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 0.75rem;
            color: #888;
            background: rgba(255,255,255,0.8);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Fotoentintados</h1>

    <div class="visor">
        <div id="mica"></div>
        <img id="armazon" src="" alt="Armazón">
    </div>

    <div class="seccion">
        <h3>Selecciona Armazón</h3>
        <select id="modelo" onchange="actualizarColores()"></select>
        <select id="colorArmazon" onchange="cambiarArmazon()"></select>
    </div>

    <div class="seccion">
        <h3>Elige la Mica</h3>
        <div id="botonesMica" style="display:flex; justify-content:center; flex-wrap:wrap;"></div>
        <button id="btnOscurecer" onclick="oscurecerActual()">Oscurecer</button>
    </div>

    <div class="version-tag">v5.2.0 - Creado por Alei</div>

    <script>
        const modelos = {
            abbas: ["chinatown","fargo","persepolis"],
            agnes: ["chocochip","fargo"],
            akira: ["guadalajara","habana","sansebastian","venecia"],
            alfonso: ["tofu"],
            aldous: ["nogal","grafito","niquel"],
            angela: ["alpes","pirineo"],
            artigas: ["laton","mercurio","plomo"],
            barb: ["bronce"],
            bernard: ["alpes","apalache","sierra"],
            bill: ["ballena","grafito"],
            "bill ventana": ["alcachofa","grafito"],
            billie: ["medianoche","limalimon","espresso","pitaya","pasita"],
            clark: ["grafito"],
            connie: ["volcan"],
            dafna: ["cedro","olivo","nube","espresso","clavel"],
            "dafna titan": ["manhattan","collins"],
            daria: ["onix", "cereza"],
            desmond: ["caliza","altamar"],
            dwight: ["tinieblas","octagon","rayo"],
            esquivel: ["grafito","niquel","chocochip","clavel"],
            "esquivel titan": ["martini","cosmopolitan"],
            fran: ["uva","cedro","olivo"],
            garcia: ["neptuno","grafito","aceituna","estela"],
            garwin: ["laton", "acero"],
            glorp: ["sideral"],
            "glorp antimateria": ["estelar","orbita"],
            godard: ["habana","hollywood","matinee","paradiso"],
            guillermo: ["supernova","medianoche","merengue"],
            jaime: ["onix","piedra"],
            jocelyn: ["laton", "mercurio"],
            joyce: ["metamorfosis", "aurora"],
            laszlo: ["laton", "acero","bronce"],
            leon: ["grafito","amate","burbuja","aceituna"],
            leone: ["berlin","cannes","rotterdam"],
            lina: ["sunset", "manhattan"],
            linda: ["plomo", "laton"],
            marcela: ["merengue","caoba"],
            "marcela reform": ["napolitano", "cacao"],
            maria: ["bronce", "plomo"],
            martin: ["onix","espresso","maple","maple burbuja"],
            max: ["rayo","octagon"],
            meryl: ["merengue","nogal"],
            moleman: ["jupiter","sombra","onix","medusa"],
            molina: ["plomo", "laton"],
            nadiaiv: ["octagon"],
            pablo: ["dolores","cleri","olivia"],
            parks: ["laton","penique","bronce","plomo"],
            pedro: ["chocochip","las vegas","paris-texas"],
            proximamente: ["sw"],
            rivera: ["nogal","onix","aceituna","pasita","daiquiri"],
            robin: ["laton","acero","plomo","bronce"],
            "robin caviar": ["osetra","beluga","esturion","caracol"],
            saramago: ["merengue","nogal"],
            sergioarmando: ["budapest","ayelen"],
            testa: ["tortuga","onix","amate"],
            tina: ["nogal","onix"],
            truman: ["onix"],
            vilma: ["rayo"],
            wong: ["hongkong","fargo"],
            yuri: ["guayaba","mojito","conga"],
            lucrecia: ["matcha","nogal","merengue"],
            yetta: ["brandy","americano","mordisco"],
            brooks: ["nogal"],
            penelope: ["nogal"],
            steven: ["nogal"],
            coen: ["nogal"],
            cortazar: ["melancolia","estela"],
            romero: ["nogal"]
        };

        const coloresMica = {
            celestun:  {inicio:"#fedee1", final:"#4f2e29"},
            mermejita: {inicio:"#d1ddb0", final:"#434343"},
            caleta:    {inicio:"#d6e3f5", final:"#4f2e29"},
            rosarito:  {inicio:"#f3f2c7", final:"#4f2e29"},
            miramar:   {inicio:"#dfd3e7", final:"#434343"},
            azufre:    {inicio:"#ecdbb0", final:"#783f03"},
            té:        {fijo:"#d0f3e2"}
        };

        let micaSeleccionada = 'celestun';
        let animacionId = null;
        let botones = [];

        function inicializarMicas() {
            const botonesContainer = document.getElementById("botonesMica");
            Object.keys(coloresMica).forEach(nombre => {
                const cont = document.createElement("div");
                cont.className = "mica-boton-container";
                const btn = document.createElement("div");
                btn.className = "boton-mica";
                btn.style.backgroundColor = (nombre === "té") ? coloresMica[nombre].fijo : coloresMica[nombre].inicio;
                btn.onclick = () => seleccionarMica(nombre, btn);
                botones.push(btn);
                const label = document.createElement("span");
                label.className = "mica-label";
                label.textContent = nombre.charAt(0).toUpperCase() + nombre.slice(1);
                cont.appendChild(btn);
                cont.appendChild(label);
                botonesContainer.appendChild(cont);
            });
        }

        function inicializarModelos() {
            const select = document.getElementById("modelo");
            Object.keys(modelos).sort().forEach(nombre => {
                const opt = document.createElement("option");
                opt.value = nombre;
                let labelText = nombre.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                if (labelText.toLowerCase().includes("nadiaiv")) labelText = "Nadia IV";
                opt.textContent = labelText;
                select.appendChild(opt);
            });
        }

        function actualizarColores() {
            const modelo = document.getElementById("modelo").value;
            const selectColor = document.getElementById("colorArmazon");
            selectColor.innerHTML = "";
            (modelos[modelo] || []).sort().forEach(color => {
                const opt = document.createElement("option");
                opt.value = color;
                opt.textContent = color.charAt(0).toUpperCase() + color.slice(1);
                selectColor.appendChild(opt);
            });
            cambiarArmazon();
        }

        function cambiarArmazon() {
            const modelo = document.getElementById("modelo").value;
            const color = document.getElementById("colorArmazon").value;
            document.getElementById("armazon").src = "img/" + modelo + "-" + color + ".png";
        }

        function seleccionarMica(nombre, boton) {
            micaSeleccionada = nombre;
            if(animacionId) cancelAnimationFrame(animacionId);
            const micaDiv = document.getElementById("mica");
            botones.forEach(b => b.classList.remove("seleccionado"));
            boton.classList.add("seleccionado");
            micaDiv.style.backgroundColor = (nombre === "té") ? coloresMica[nombre].fijo : coloresMica[nombre].inicio;
            document.getElementById("btnOscurecer").disabled = (nombre === "té");
        }

        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
            return {r, g, b};
        }

        function oscurecerActual() {
            if(micaSeleccionada === "té") return;
            const inicio = hexToRgb(coloresMica[micaSeleccionada].inicio);
            const final = hexToRgb(coloresMica[micaSeleccionada].final);
            const duracion = 1500;
            let start = null;
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = (timestamp - start) / duracion;
                if (progress > 1) progress = 1;
                let r = Math.round(inicio.r + (final.r - inicio.r) * progress);
                let g = Math.round(inicio.g + (final.g - inicio.g) * progress);
                let b = Math.round(inicio.b + (final.b - inicio.b) * progress);
                document.getElementById("mica").style.backgroundColor = `rgb(${r},${g},${b})`;
                if (progress < 1) animacionId = requestAnimationFrame(step);
            }
            if(animacionId) cancelAnimationFrame(animacionId);
            animacionId = requestAnimationFrame(step);
        }

        inicializarMicas();
        inicializarModelos();
        actualizarColores();
        seleccionarMica('celestun', botones[0]);
    </script>
</body>
</html>
